name: 🐛 Bug Report
description: File a bug report to help us improve.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form with as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior. Please provide a minimal code sample or repository if applicable.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: If applicable, add screenshots or screen recordings to help explain your problem.
      placeholder: Drag and drop images here...
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment / OS
      description: What environment are you running this on?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Web Browser
        - Other
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Code of Conduct & Checks
      description: By submitting this issue, you agree to follow our project's guidelines.
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported yet.
          required: true
        - label: I am using the latest version of the project.
          required: true