name: 🚀 Feature Request
description: Suggest an idea or a new feature for this project.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make this project better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "Example: I'm frustrated when I try to do X because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: "Example: It would be great if the app could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: "Example: I tried doing Y, but it doesn't work well because..."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false

  - type: checkboxes
    id: community-pitch
    attributes:
      label: Willingness to contribute
      options:
        - label: I would be willing to submit a Pull Request for this feature myself!
          required: false