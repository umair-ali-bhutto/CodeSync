<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <title>CodeSync Login</title>
    <link rel="icon" th:href="@{/images/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
    <div class="card">
        <h2>CodeSync</h2>

        <!-- Show error if login failed -->
        <div th:if="${param.error}" class="error">Invalid username or password.</div>
        <!-- Show message if logged out -->
        <div th:if="${param.logout}" class="logout">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <!-- CSRF token - required by Spring Security -->
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
            <label>Username</label>
            <input type="text" name="username" autofocus required />
            <label>Password</label>
            <input type="password" name="password" required />
            <button type="submit">Login</button>
        </form>
    </div>
</body>

</html>
