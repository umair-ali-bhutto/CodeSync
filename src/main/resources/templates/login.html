<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>CodeSync Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
        h2 { margin-bottom: 1.5rem; color: #333; text-align: center; }
        label { display: block; margin-bottom: 0.3rem; color: #555; font-size: 14px; }
        input { width: 100%; padding: 0.6rem 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 0.7rem; background: #4A90D9; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
        button:hover { background: #357ABD; }
        .error { background: #fdecea; color: #c0392b; padding: 0.6rem 0.8rem; border-radius: 4px; margin-bottom: 1rem; font-size: 13px; }
        .logout { background: #eafaf1; color: #1e8449; padding: 0.6rem 0.8rem; border-radius: 4px; margin-bottom: 1rem; font-size: 13px; }
    </style>
</head>
<body>
<div class="card">
    <h2>CodeSync</h2>

    <!-- Show error if login failed -->
    <div th:if="${param.error}" class="error">Invalid username or password.</div>
    <!-- Show message if logged out -->
    <div th:if="${param.logout}" class="logout">You have been logged out.</div>

    <form th:action="@{/login}" method="post">
        <!-- CSRF token - required by Spring Security -->
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
        <label>Username</label>
        <input type="text" name="username" autofocus required />
        <label>Password</label>
        <input type="password" name="password" required />
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
