<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" th:href="@{/images/favicon.ico}">

    <title th:text="'Error ' + ${errorCode} + ' | CodeSync'">Error | CodeSync</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>

<body>
    <div class="card">

        <!-- Colour class: 5xx = red, 4xx = yellow -->
        <div class="code" th:classappend="${errorCode >= 500} ? 'code-5xx' : 'code-4xx'" th:text="${errorCode}">500
        </div>

        <h2 th:text="${errorTitle}">Something Went Wrong</h2>

        <p class="desc" th:text="${errorDescription}">
            An unexpected error occurred.
        </p>

        <a th:href="@{${backUrl}}" class="btn">
            <span th:text="${errorCode == 401 ? 'Go to Login' : (errorCode == 403 ? 'Back to Dashboard' : 'Home')}">
                Home
            </span>
        </a>


    </div>
</body>

</html>
